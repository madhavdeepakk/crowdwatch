[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdwatch"
version = "1.0.0"
description = "Real-time overcrowding detection for malls and public places from ordinary CCTV video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Madhav Deepak" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.16",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "scipy>=1.10"]
benchmark = ["scipy>=1.10"]          # only to read the benchmark's ground-truth files
mcp = ["mcp>=1.2"]
density = ["torch>=2.0"]            # only to convert the density model once
train = ["scikit-learn>=1.3", "skl2onnx>=1.16"]

[project.scripts]
crowdwatch = "crowdwatch.cli:main"

[tool.setuptools.packages.find]
include = ["crowdwatch*"]

[tool.setuptools.package-data]
crowdwatch = ["server/static/*", "server/static/fonts/*", "models/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
